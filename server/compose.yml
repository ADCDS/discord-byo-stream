# BYO Stream's server: the token service, and optionally LiveKit itself.
# Configure it in .env next to this file (see .env.example), then: docker compose up -d
name: dstream
services:
  # Swaps access keys for LiveKit tokens. It only signs tokens, so it runs locked down
  # with no writable filesystem.
  tokens:
    image: python:3.13-alpine
    restart: unless-stopped
    user: "${UID_GID:-1000:1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    pids_limit: 64
    command: ["python", "-u", "/app/server.py"]
    env_file: .env
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - ./server.py:/app/server.py:ro
      - ./data:/data:ro
      # The LiveKit keys can come from a livekit.yml instead of .env. It's a
      # single-file mount: restart this service if that file is replaced.
      - ${LIVEKIT_YML:-/dev/null}:/run/livekit.yml:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # LiveKit, for servers that don't run one yet. Started when .env has
  # COMPOSE_PROFILES=livekit. Host networking, because media uses a wide UDP range.
  livekit:
    profiles: [livekit]
    image: livekit/livekit-server:v1.13.10
    restart: unless-stopped
    network_mode: host
    command: ["--config", "/etc/livekit.yml"]
    volumes:
      - ./livekit.yml:/etc/livekit.yml:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
